# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hypr.land/Configuring/Window-Rules/
# Refactored for Hyprland 0.53+ syntax:
#   - Match condition comes FIRST, rule comes SECOND
#   - 'class:^(name)$' regex matcher → 'match:class name' (no regex anchors)
#   - 'initialTitle:' → 'match:initial_title'
#   - 'title:' → 'match:title'
#   - Multiple match conditions: 'match:class X match:title Y'

# ── Opacity rules: browsers ────────────────────────────────────────────
windowrule = match:class firefox, opacity 0.90 0.90
windowrule = match:class Brave-browser, opacity 0.90 0.90

# ── Opacity rules: editors ─────────────────────────────────────────────
windowrule = match:class code-oss, opacity 0.80 0.80
windowrule = match:class Code, opacity 0.80 0.80
windowrule = match:class code-url-handler, opacity 0.80 0.80
windowrule = match:class code-insiders-url-handler, opacity 0.80 0.80

# ── Opacity rules: terminal & file manager ─────────────────────────────
windowrule = match:class kitty, opacity 0.80 0.80
windowrule = match:class org.kde.dolphin, opacity 0.80 0.80
windowrule = match:class org.kde.ark, opacity 0.80 0.80

# ── Opacity rules: theming utilities ───────────────────────────────────
windowrule = match:class nwg-look, opacity 0.80 0.80
windowrule = match:class qt5ct, opacity 0.80 0.80
windowrule = match:class qt6ct, opacity 0.80 0.80
windowrule = match:class kvantummanager, opacity 0.80 0.80

# ── Opacity rules: system tray apps ────────────────────────────────────
windowrule = match:class org.pulseaudio.pavucontrol, opacity 0.80 0.70
windowrule = match:class blueman-manager, opacity 0.80 0.70
windowrule = match:class nm-applet, opacity 0.80 0.70
windowrule = match:class nm-connection-editor, opacity 0.80 0.70
windowrule = match:class org.kde.polkit-kde-authentication-agent-1, opacity 0.80 0.70
windowrule = match:class polkit-gnome-authentication-agent-1, opacity 0.80 0.70
windowrule = match:class org.freedesktop.impl.portal.desktop.gtk, opacity 0.80 0.70
windowrule = match:class org.freedesktop.impl.portal.desktop.hyprland, opacity 0.80 0.70

# ── Opacity rules: media & gaming ──────────────────────────────────────
windowrule = match:class [Ss]team, opacity 0.70 0.70
windowrule = match:class steamwebhelper, opacity 0.70 0.70
windowrule = match:class Spotify, opacity 0.70 0.70
windowrule = match:initial_title Spotify Free, opacity 0.70 0.70

# ── Opacity rules: flatpak/electron apps ───────────────────────────────
windowrule = match:class com.github.rafostar.Clapper, opacity 0.90 0.90
windowrule = match:class com.github.tchx84.Flatseal, opacity 0.80 0.80
windowrule = match:class hu.kramo.Cartridges, opacity 0.80 0.80
windowrule = match:class com.obsproject.Studio, opacity 0.80 0.80
windowrule = match:class gnome-boxes, opacity 0.80 0.80
windowrule = match:class discord, opacity 0.80 0.80
windowrule = match:class WebCord, opacity 0.80 0.80
windowrule = match:class ArmCord, opacity 0.80 0.80
windowrule = match:class app.drey.Warp, opacity 0.80 0.80
windowrule = match:class net.davidotek.pupgui2, opacity 0.80 0.80
windowrule = match:class yad, opacity 0.80 0.80
windowrule = match:class Signal, opacity 0.80 0.80
windowrule = match:class io.github.alainm23.planify, opacity 0.80 0.80
windowrule = match:class io.gitlab.theevilskeleton.Upscaler, opacity 0.80 0.80
windowrule = match:class com.github.unrud.VideoDownloader, opacity 0.80 0.80
windowrule = match:class io.gitlab.adhami3310.Impression, opacity 0.80 0.80
windowrule = match:class io.missioncenter.MissionCenter, opacity 0.80 0.80
windowrule = match:class io.github.flattool.Warehouse, opacity 0.80 0.80

# ── Float rules: dialogs and pop-outs ──────────────────────────────────
windowrule = match:class org.kde.dolphin match:title Progress Dialog — Dolphin, float 1
windowrule = match:class org.kde.dolphin match:title Copying — Dolphin, float 1
windowrule = match:class firefox match:title Picture-in-Picture, float 1
windowrule = match:class firefox match:title Library, float 1

# ── Float rules: terminal monitors ─────────────────────────────────────
windowrule = match:class kitty match:title top, float 1
windowrule = match:class kitty match:title btop, float 1
windowrule = match:class kitty match:title htop, float 1

# ── Float rules: utilities ─────────────────────────────────────────────
windowrule = match:class vlc, float 1
windowrule = match:class kvantummanager, float 1
windowrule = match:class qt5ct, float 1
windowrule = match:class qt6ct, float 1
windowrule = match:class nwg-look, float 1
windowrule = match:class org.kde.ark, float 1
