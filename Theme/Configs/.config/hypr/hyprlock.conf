general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.89
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(191724)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    check_color = rgb(eb6f92)
    fail_color = rgb(31748f)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(f6c177)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(e0def4ff)
    font_size = 72
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %e")"
    color = rgba(e0def4cc)
    font_size = 22
    font_family = Inter
    position = 0, 20
    halign = center
    valign = center
}
